<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AstraNova">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0b12" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="manifest" href="/manifest.json">
<title>AstraNova</title>
<style>
:root { --bg: #fff; --surface: #f6f5fa; --raised: #fff; --sunk: #efedf6; --ink: #17141f; --ink2: #474257; --ink3: #67627a; --line: #e3e0ec;
  --accent: #5a43dd; --accent-soft: #eeeafe; --me: #5a43dd; --bad: #b8325a; --ok: #1f8a5b; --cyan: #2a9fd0; --rose: #c84b98; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0c0b12; --surface: #12111a; --raised: #1a1825; --sunk: #221f2f; --ink: #f2f0f8; --ink2: #c3bfd4;
  --ink3: #948fa8; --line: #2a2738; --accent: #9d8dff; --accent-soft: #241f3f; --me: #6c56ee; --bad: #ff7fa2; --ok: #4cc08a; color-scheme: dark; } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 400 16px/1.45 -apple-system, "SF Pro Text", system-ui, sans-serif; }
body { display: flex; flex-direction: column; height: 100dvh; }
header { display: flex; align-items: center; gap: 11px; padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); position: relative; overflow: hidden; }
header::after { content: ""; position: absolute; left: 30%; right: -20%; top: calc(env(safe-area-inset-top) + 30px); height: 1px;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 50%, transparent), transparent); }
.orb { position: relative; width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 600;
  background: radial-gradient(circle, #fff 0 4%, transparent 18%), linear-gradient(140deg, var(--rose), var(--accent) 60%, var(--cyan)); }
.orb.sm { width: 26px; height: 26px; font-size: 12px; }
header b { display: block; font-size: 17px; } header small { color: var(--ink3); font-size: 13px; }
header .grow { flex: 1; }
header button { background: none; border: 1px solid var(--line); color: var(--ink2); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 13px; }
#list { flex: 1; overflow-y: auto; padding: 12px 12px 6px; -webkit-overflow-scrolling: touch; }
.m { display: flex; gap: 8px; align-items: flex-end; margin: 3px 0; }
.m.first { margin-top: 12px; }
.m .b { max-width: 80%; padding: 8px 13px; border-radius: 18px; background: var(--raised); border: 1px solid var(--line); white-space: pre-wrap; word-wrap: break-word; }
.m:not(.me) .b { border-bottom-left-radius: 5px; }
.m.me { justify-content: flex-end; } .m.me .b { background: var(--me); color: #fff; border-color: transparent; border-bottom-right-radius: 5px; }
.m .orb { visibility: hidden; } .m.first .orb { visibility: visible; }
a { color: var(--accent); word-break: break-all; } .m.me a { color: #fff; }
.task { margin: 10px 0 10px 34px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
.task .th { display: flex; gap: 10px; align-items: center; padding: 9px 11px; }
.task .th div { flex: 1; min-width: 0; } .task .th b { font-size: 13px; display: block; }
.task .th span { font-size: 13px; color: var(--ink2); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task .st { font-size: 12px; color: var(--ink3); white-space: nowrap; } .task.running .st { color: var(--accent); }
.task .steps { padding: 0 11px 9px 22px; font-size: 13px; color: var(--ink3); display: none; }
.task.open .steps { display: block; }
.task .steps div { padding: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task .steps div::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 2px; }
.req { margin: 10px 0 10px 34px; padding: 12px; border-radius: 12px; border: 1.5px solid var(--accent); background: var(--raised); }
.req b { display: block; margin-bottom: 6px; } .req pre { white-space: pre-wrap; font: 13px/1.45 ui-monospace, monospace; background: var(--sunk); padding: 8px; border-radius: 8px; max-height: 240px; overflow: auto; }
.req .row { display: flex; gap: 8px; margin-top: 8px; } .req input { flex: 1; }
.req.done { opacity: .6; border-color: var(--line); }
button.p, button.g { font: inherit; font-size: 15px; border-radius: 10px; padding: 9px 16px; border: 1px solid transparent; }
button.p { background: var(--accent); color: #fff; } button.g { background: var(--raised); border-color: var(--line); color: var(--ink); }
.typing { display: inline-flex; gap: 4px; } .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: d 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes d { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
footer { display: flex; gap: 8px; align-items: flex-end; padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px); border-top: 1px solid var(--line); background: var(--bg); }
textarea, input { flex: 1; font: inherit; color: var(--ink); background: var(--raised); border: 1px solid var(--line); border-radius: 20px; padding: 9px 14px; resize: none; max-height: 140px; outline: none; }
textarea:focus, input:focus { border-color: var(--accent); }
#send { width: 40px; height: 40px; border-radius: 50%; border: 0; flex: none; color: #fff; display: grid; place-items: center;
  background: radial-gradient(circle, #fff 0 6%, transparent 22%), linear-gradient(135deg, var(--accent), var(--cyan)); }
#send svg { width: 20px; height: 20px; fill: #fff; }
.center { flex: 1; display: grid; place-items: center; text-align: center; padding: 30px; color: var(--ink2); }
.toast { position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 64px); padding: 10px 14px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 14px; z-index: 9; }
</style>
</head>
<body>
<header><div class="orb" id="av">N</div><div class="grow"><b id="name">Nova</b><small id="status">connecting</small></div><button id="stop">Stop all</button></header>
<div id="list"></div>
<footer><textarea id="t" rows="1" placeholder="Message"></textarea><button id="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 3L12.9 11.1L21 12L12.9 12.9L12 21L11.1 12.9L3 12L11.1 11.1Z"/><circle cx="12" cy="12" r="2.2"/></svg></button></footer>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const link = s => esc(s).replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
let key = "";
try { const m = location.hash.match(/k=([\w-]+)/); if (m) { localStorage.setItem("an-key", m[1]); history.replaceState(null, "", "/"); } key = localStorage.getItem("an-key") || ""; } catch { const m = location.hash.match(/k=([\w-]+)/); key = m ? m[1] : ""; }
let fname = "Nova", seq = 0, last = null, live = null, typingEl = null;
const tasks = {};
const H = () => ({ "X-AstraNova-Key": key, "Content-Type": "application/json" });
async function get(p) { const r = await fetch(p, { headers: H() }); if (r.status === 401) throw new Error("key"); return r.json(); }
async function post(p, b) { const r = await fetch(p, { method: "POST", headers: H(), body: JSON.stringify(b || {}) }); return r.json(); }
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3000); }
function down() { const l = $("#list"); l.scrollTop = l.scrollHeight; }
function bubble(text, me) {
  const d = document.createElement("div"); const who = me ? "me" : "them";
  d.className = "m" + (me ? " me" : "") + (who !== last ? " first" : ""); last = who;
  d.innerHTML = (me ? "" : `<div class="orb sm">${esc(fname[0])}</div>`) + `<div class="b">${link(text)}</div>`;
  $("#list").appendChild(d); down(); return d;
}
function say(text, me) { if (me) return bubble(text, true); let x; for (const p of String(text).split(/\n\s*\n/).filter(s => s.trim())) x = bubble(p.trim(), false); return x; }
function noThink(t) {
  t = String(t || "").replace(/<(think|thinking|reasoning)>[\s\S]*?(<\/\1>|$)/gi, "").replace(/<\|channel\|>\s*analysis[\s\S]*?(<\|end\|>|$)/gi, "")
    .replace(/<\|[a-z]+\|>(assistant|final|commentary)?(<\|message\|>)?/gi, "");
  const o = t.search(/<\/(think|thinking|reasoning)>/i); return o >= 0 ? t.slice(t.indexOf(">", o) + 1) : t;
}
function typing(on) {
  if (typingEl) { typingEl.remove(); typingEl = null; }
  if (on) { typingEl = document.createElement("div"); typingEl.className = "m first"; typingEl.innerHTML = `<div class="orb sm">${esc(fname[0])}</div><div class="b"><span class="typing"><i></i><i></i><i></i></span></div>`; $("#list").appendChild(typingEl); down(); }
}
function task(id, text, status, steps) {
  let t = tasks[id];
  if (!t) {
    const el = document.createElement("div"); el.className = "task";
    el.innerHTML = `<div class="th"><div><b>Astra</b><span>${esc(text)}</span></div><span class="st"></span></div><div class="steps"></div>`;
    el.onclick = () => el.classList.toggle("open");
    $("#list").appendChild(el); last = null; t = tasks[id] = { el, n: 0 };
    (steps || []).forEach(s => addStep(id, s.label, s.args));
  }
  setTask(id, status); down(); return t;
}
function addStep(id, label, args) {
  const t = tasks[id]; if (!t) return; t.n++;
  const a = args ? (args.url || args.question || args.query || args.title || args.task || Object.values(args)[0] || "") : "";
  const d = document.createElement("div"); d.textContent = label + (a ? "  " + String(a).slice(0, 60) : ""); t.el.querySelector(".steps").appendChild(d);
}
function setTask(id, status) {
  const t = tasks[id]; if (!t) return; if (status) t.status = status;
  t.el.className = "task " + (t.status || "") + (t.el.classList.contains("open") ? " open" : "");
  const L = { running: "working", done: "done", failed: "didn't work", stopped: "stopped" }[t.status] || t.status || "";
  t.el.querySelector(".st").textContent = `${L} · ${t.n} step${t.n === 1 ? "" : "s"}`;
}
function request(r) {
  if (document.querySelector(`.req[data-id="${r.id}"]`)) return;
  const d = document.createElement("div"); d.className = "req"; d.dataset.id = r.id;
  d.innerHTML = `<b>${esc(r.title)}</b>${r.details ? `<pre>${esc(r.details)}</pre>` : ""}` + (r.kind === "confirm"
    ? `<div class="row"><button class="p" data-v="1">${r.title.startsWith("Your turn") ? "Done" : "Approve"}</button><button class="g" data-v="0">Decline</button></div>`
    : `<div class="row"><input placeholder="Your answer"><button class="p">Send</button></div>`);
  d.querySelectorAll("button").forEach(b => b.onclick = () => {
    const inp = d.querySelector("input");
    post("/api/answer", { id: r.id, value: inp ? inp.value : b.dataset.v === "1" });
  });
  $("#list").appendChild(d); last = null; down();
}
function resolved(id, a) { const d = document.querySelector(`.req[data-id="${id}"]`); if (d) { d.classList.add("done"); d.querySelector(".row").innerHTML = `<small>${a === true ? "Approved" : a === false || a == null ? "Declined" : "Answered"}</small>`; } }
function handle(e) {
  const conv = String(e.conv || ""), tid = conv.startsWith("nova-task-") ? conv.slice(10) : e.task;
  if (e.type === "request") return request(e);
  if (e.type === "request_done") return resolved(e.id, e.answer);
  if (e.type === "notify") return toast(e.text);
  if (conv.startsWith("nova-task-")) { if (e.type === "tool_start") { task(tid, "", "running"); addStep(tid, e.label, e.args); setTask(tid); } return; }
  if (e.type === "task_start") { typing(false); task(e.task, e.text, "running"); $("#status").textContent = "Astra is working"; return; }
  if (e.type === "task_done") { setTask(e.task, e.status); if (e.status !== "stopped") typing(true); return; }
  if (e.type === "typing") { typing(true); $("#status").textContent = "typing"; return; }
  if (e.type === "assistant_start") { typing(true); $("#status").textContent = "typing"; return; }
  if (e.type === "token") { if (!live) { typing(false); live = { el: bubble("", false), text: "" }; } live.text += e.text; live.el.querySelector(".b").textContent = noThink(live.text).trim(); down(); return; }
  if (e.type === "rewrite") { if (live) live.text = e.text; return; }
  if (e.type === "tool_start" && live && !live.text.trim()) { live.el.remove(); live = null; return; }
  if (e.type === "done") {
    typing(false);
    const text = noThink(e.text || (live ? live.text : "")); if (live) { const first = live.el.classList.contains("first"); live.el.remove(); last = first ? null : "them"; }
    live = null; if (text && text.trim()) say(text, false);
    $("#status").textContent = Object.values(tasks).some(t => t.status === "running") ? "Astra is working" : "here";
  }
}
async function poll() {
  while (true) {
    try { const r = await get(`/api/poll?since=${seq}`); r.events.forEach(handle); seq = r.seq; $("#status").textContent ||= "here"; }
    catch (err) { if (String(err.message) === "key") return locked(); $("#status").textContent = "reconnecting"; await new Promise(r => setTimeout(r, 3000)); }
  }
}
function locked() { document.body.innerHTML = `<div class="center"><div><div class="orb" style="margin:0 auto 14px;width:56px;height:56px">N</div>Open the link from AstraNova on your PC (Settings › iPhone) to connect this phone.</div></div>`; }
async function start() {
  if (!key) return locked();
  try {
    const s = await get("/api/state"); fname = s.friend; seq = s.seq;
    $("#name").textContent = fname; $("#av").textContent = fname[0]; $("#t").placeholder = `Message ${fname}`;
    const h = await get("/api/chat");
    for (const it of h.items) {
      if (it.role === "user") say(it.text, true);
      else if (it.role === "assistant") say(it.text, false);
      else if (it.role === "task") task(it.id, it.task, (h.tasks_running || []).includes(it.id) ? "running" : it.status, it.steps);
    }
    (s.requests || []).forEach(request);
    $("#status").textContent = h.running ? "typing" : "here"; if (h.running) typing(true);
    poll();
  } catch (err) { if (String(err.message) === "key") locked(); else { $("#status").textContent = "PC not reachable"; setTimeout(start, 4000); } }
}
async function send() {
  const t = $("#t").value.trim(); if (!t) return;
  $("#t").value = ""; $("#t").style.height = "auto"; say(t, true);
  const r = await post("/api/send", { text: t }); if (r && r.error === "busy") toast(`${fname} is still answering`); else typing(true);
}
$("#send").onclick = send;
$("#t").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px"; });
$("#t").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !/iPhone|iPad/.test(navigator.userAgent)) { e.preventDefault(); send(); } });
$("#stop").onclick = () => { post("/api/stop"); toast("Stopped everything"); };
start();
</script>
</body>
</html>
