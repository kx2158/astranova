name: Release

# A new release is built whenever the version in astra/__init__.py changes on main
# (or a v* tag is pushed, or it's started by hand). Installed copies pick it up on their own.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is this a new version?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "import astra; print(astra.__version__)")
          echo "v=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$v" ]]; then
            echo "astra/__init__.py says $v but the tag is $GITHUB_REF_NAME"; exit 1
          fi
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" != refs/tags/* ]]; then
            echo "Version $v is already released, nothing to build."
            echo "build=no" >> "$GITHUB_OUTPUT"
          else
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the installer
        if: steps.ver.outputs.build == 'yes'
        shell: cmd
        env:
          CI: "1"
        run: call build_installer.bat

      - name: Publish the release
        if: steps.ver.outputs.build == 'yes'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.ver.outputs.v }}"
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" release/AstraNova-Setup.exe "release/AstraNova-$v.zip" --clobber
          else
            gh release create "v$v" release/AstraNova-Setup.exe "release/AstraNova-$v.zip" \
              --target "$GITHUB_SHA" --title "AstraNova $v" --generate-notes
          fi
