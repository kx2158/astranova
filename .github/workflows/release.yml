name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(python -c "import astra; print(astra.__version__)")
          t="${GITHUB_REF_NAME#v}"
          if [ "$v" != "$t" ]; then echo "astra/__init__.py says $v but the tag is $GITHUB_REF_NAME"; exit 1; fi

      - name: Build the installer
        shell: cmd
        env:
          CI: "1"
        run: call build_installer.bat

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "import astra; print(astra.__version__)")
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then tag="v$v"; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/AstraNova-Setup.exe "release/AstraNova-$v.zip" --clobber
          else
            gh release create "$tag" release/AstraNova-Setup.exe "release/AstraNova-$v.zip" \
              --title "AstraNova $v" --generate-notes
          fi
