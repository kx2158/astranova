name: Release

# A new release is built whenever the version in astra/__init__.py changes on main
# (or a v* tag is pushed, or it's started by hand): the Windows installer and the Mac app.
# Installed copies pick it up on their own.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.ver.outputs.v }}
      build: ${{ steps.ver.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('astra/__init__.py').read()).group(1))")
          echo "v=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF_NAME#v}" != "$v" ]]; then
            echo "astra/__init__.py says $v but the tag is $GITHUB_REF_NAME"; exit 1
          fi
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" != refs/tags/* ]]; then
            echo "Version $v is already released, nothing to build."
            echo "build=no" >> "$GITHUB_OUTPUT"
          else
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    if: needs.version.outputs.build == 'yes'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Code-signing certificate (only if one is set up in the repo's secrets)
        shell: pwsh
        env:
          PFX: ${{ secrets.SIGN_PFX_BASE64 }}
        run: |
          if ($env:PFX) {
            $f = "$env:RUNNER_TEMP\sign.pfx"
            [IO.File]::WriteAllBytes($f, [Convert]::FromBase64String($env:PFX))
            "SIGN_PFX=$f" | Out-File -Append $env:GITHUB_ENV
          } else { "No certificate: building unsigned." }
      - name: Build the installer
        shell: cmd
        env:
          CI: "1"
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: call build_installer.bat
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/AstraNova-Setup.exe
            release/AstraNova-*.zip

  mac:
    needs: version
    if: needs.version.outputs.build == 'yes'
    runs-on: macos-latest          # Apple Silicon (M1 and newer)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Developer ID certificate (only if one is set up in the repo's secrets)
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "No certificate: building unsigned."; exit 0; fi
          kc="$RUNNER_TEMP/sign.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$kc" && security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p ci "$kc"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id=$(security find-identity -v -p codesigning "$kc" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
          echo "MAC_SIGN_ID=$id" >> "$GITHUB_ENV"
      - name: Build the Mac app
        env:
          PYTHON: python
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: sh build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/AstraNova-macOS.zip
            release/AstraNova-macOS.dmg

  release:
    needs: [version, windows, mac]
    if: always() && needs.version.outputs.build == 'yes' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.version.outputs.v }}"
          ls -la out
          files=$(ls out/*)
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" $files --clobber
          else
            gh release create "v$v" $files --target "$GITHUB_SHA" --title "AstraNova $v" --generate-notes
          fi
